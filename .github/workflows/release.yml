name: CI and Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/test.yml

  ci-artifacts:
    needs: checks
    uses: ./.github/workflows/release-build.yml
    permissions:
      contents: write
    with:
      ref: ${{ github.sha }}
      snapshot: true
      publish: false
      checks_completed: true
    secrets: inherit
