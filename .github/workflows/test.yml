# Terraform Provider testing workflow.
name: Tests

# This GitHub action runs your tests for each pull request.
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
  workflow_dispatch:
  pull_request:
    branches-ignore:
      - 'release-please*'

# Testing only needs permissions to read the repository contents.
permissions:
  contents: read

jobs:
  # Ensure project builds before running tests
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true
      - run: go mod download
      - run: go build -v .
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12
          args: --tests=false

  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true
      # We need the latest version of Terraform for our documentation generation to use
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - uses: arduino/setup-task@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task generate
      - name: git diff
        run: |
          git diff --compact-summary --exit-code || \
            (echo; echo "Unexpected difference in directories after code generation. Run 'task generate' command and commit."; exit 1)

  # Build the exact EX contract revision and test in a disposable SQLite environment.
  test:
    name: Semaphore EX Acceptance Tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/checkout@v6
        with:
          repository: freefair/semaphore-ex
          # Semaphore EX v2.20.0-ex.2: task SSH bindings and provider API contracts.
          ref: f6e216f7eec730a1fa4fe381e189c9a973ecfa0d
          path: .test-semaphore-ex
      - uses: actions/setup-go@v6
        with:
          go-version-file: '.test-semaphore-ex/go.mod'
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: '24.19.0'
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.15.2'
          terraform_wrapper: false
      - uses: arduino/setup-task@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Semaphore EX
        working-directory: .test-semaphore-ex
        run: |
          npm ci --prefix web
          task build:fe
          task build:be
      - name: Set up provider Go toolchain
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Run isolated acceptance tests
        run: task testacc
        env:
          SEMAPHORE_EX_TEST_BINARY: ${{ github.workspace }}/.test-semaphore-ex/bin/semaphore

  # Wrapper job to allow us to require all tests in the matrix
  all-tests:
    name: Test Matrix
    runs-on: ubuntu-latest
    needs: [build, generate, test]
    if: always()
    steps:
      - name: Check matrix status
        if: ${{ needs.build.result != 'success' || needs.generate.result != 'success' || needs.test.result != 'success' }}
        run: exit 1
